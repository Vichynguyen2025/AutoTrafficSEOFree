appId: com.autotraffic.seo
productName: AutoTrafficSEO
directories:
  output: dist-release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - prisma/**/*
  - node_modules/@prisma/**/*
  - node_modules/.prisma/**/*
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: node_modules/.prisma
    to: node_modules/.prisma
    filter:
      - "**/*"