name: Build Windows (.exe)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      NODE_VERSION: '20'
      DATABASE_URL: 'mysql://localhost:3306/autotraffic_seo_placeholder'
      PLAYWRIGHT_BROWSERS_PATH: '0'

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npx prisma generate
          npm run build:electron

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron app
        run: npm run build:electron

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist-release
        shell: pwsh
        run: |
          if (Test-Path "dist-release") {
            Get-ChildItem -Path "dist-release" -Recurse | Select-Object Name, Length
          } else {
            Write-Host "dist-release directory not found"
            Get-ChildItem -Path "." -Directory | Select-Object Name
          }

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTrafficSEO-Setup
          path: dist-release/
          if-no-files-found: error

      - name: Create Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoTrafficSEO v1.0.0-build.${{ github.run_number }}
          body: |
            ## AutoTrafficSEO Build ${{ github.run_number }}

            - **Branch:** `develop`
            - **Commit:** ${{ github.sha }}
            - **Build ID:** ${{ github.run_id }}
            - **Trigger:** ${{ github.event_name }}

            ### 📥 Download
            - `AutoTrafficSEO Setup *.exe` — Windows installer (NSIS)

            ### ⚙️ How to Install
            1. Download the `.exe` file
            2. Run the installer
            3. Configure MySQL connection in `.env`
            4. Run `npx prisma db push` to sync database
            5. Launch AutoTrafficSEO

            ### 🔧 Tech Stack
            - Electron + React + TypeScript
            - Playwright + Chromium
            - MySQL + Prisma ORM
            - Tailwind CSS

            ### 📝 Notes
            - This is a **pre-release** build for testing
            - Requires MySQL database
            - Requires Playwright Chromium (`npx playwright install chromium`)
          prerelease: true
          draft: false
          generate_release_notes: true
          files: dist-release/*
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}